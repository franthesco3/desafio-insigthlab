[package]
name = "matrix_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
matrix-sdk = "0.19.1"
matrix-sdk-ui = "0.19.1"
# Compila o SQLite junto com o crate: evita depender do SQLite do sistema
# (ausente no Windows e não linkado automaticamente na lib estática do macOS).
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures-util = "0.3"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
