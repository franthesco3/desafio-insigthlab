include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - rust_builder/**
    - lib/core/native/bridge/**
    - build/**

linter:
  rules:
    # Projeto de aplicação, não um pacote publicado: documentar toda API pública gera ruído.
    public_member_api_docs: false
    # Interfaces de um método só são intencionais (DIP + substituição em testes).
    one_member_abstracts: false
    # Comandos de ViewModel são métodos (passados como callbacks pela View).
    use_setters_to_change_properties: false
